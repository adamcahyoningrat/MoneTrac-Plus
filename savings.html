<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target Tabungan - MoneTrac+</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-theme="light">
  <div class="app-layout">
    <!-- Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <div class="main-content">
      <!-- Dynamic Navbar -->
      <div id="navbar-container"></div>

      <!-- Main Page Content -->
      <main class="content-wrapper">
        
<!-- Savings Summary Metric Cards -->
<div class="stats-grid">
  <div class="stat-card" style="--stat-gradient: var(--primary-gradient); --stat-color: var(--primary); --stat-bg: rgba(59, 130, 246, 0.12);">
    <div class="stat-card-header">
      <span class="stat-label">Total Dana Terkumpul</span>
      <div class="stat-icon"><i class="fa-solid fa-vault"></i></div>
    </div>
    <div class="stat-value" id="savings-total-collected" style="color:var(--primary);">Rp 0</div>
    <div class="stat-footer">
      <span class="stat-trend up"><i class="fa-solid fa-circle-check"></i> Siap dialokasikan</span>
    </div>
  </div>

  <div class="stat-card" style="--stat-gradient: var(--accent-gradient); --stat-color: #8b5cf6; --stat-bg: rgba(139, 92, 246, 0.12);">
    <div class="stat-card-header">
      <span class="stat-label">Total Target Tabungan</span>
      <div class="stat-icon"><i class="fa-solid fa-bullseye"></i></div>
    </div>
    <div class="stat-value" id="savings-total-target">Rp 0</div>
    <div class="stat-footer">
      <span style="font-size:0.8rem;color:var(--text-muted);">Semua celengan aktif</span>
    </div>
  </div>

  <div class="stat-card" style="--stat-gradient: var(--warning-gradient); --stat-color: var(--warning); --stat-bg: rgba(245, 158, 11, 0.12);">
    <div class="stat-card-header">
      <span class="stat-label">Sisa Dana Dibutuhkan</span>
      <div class="stat-icon"><i class="fa-solid fa-hourglass-half"></i></div>
    </div>
    <div class="stat-value" id="savings-total-remaining" style="color:var(--warning);">Rp 0</div>
    <div class="stat-footer">
      <span style="font-size:0.8rem;color:var(--text-muted);">Untuk mencapai 100% target</span>
    </div>
  </div>

  <div class="stat-card" style="--stat-gradient: var(--success-gradient); --stat-color: var(--success); --stat-bg: rgba(16, 185, 129, 0.12);">
    <div class="stat-card-header">
      <span class="stat-label">Persentase Capaian</span>
      <div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div>
    </div>
    <div class="stat-value" id="savings-total-percent" style="color:var(--success);">0%</div>
    <div class="stat-footer">
      <span class="stat-trend up"><i class="fa-solid fa-arrow-trend-up"></i> Terus tingkatkan tabungan!</span>
    </div>
  </div>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
  <div>
    <h2 style="font-size:1.25rem;font-weight:700;color:var(--text-primary);">Daftar Celengan Impian</h2>
    <p style="font-size:0.85rem;color:var(--text-muted);">Lacak progres tabungan untuk setiap kebutuhan & impian Anda</p>
  </div>

  <button class="btn btn-primary" onclick="Modal.openSavingsGoalModal()">
    <i class="fa-solid fa-plus"></i> Buat Target Tabungan
  </button>
</div>

<!-- Goals Grid Container -->
<div class="goals-grid" id="goals-grid">
  <!-- Dynamic Goals Cards Injected Here -->
</div>

      </main>
    </div>
  </div>

    <!-- Universal Scripts -->
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/components/navbar.js"></script>
  <script src="assets/components/sidebar.js"></script>
  <script src="assets/components/modal.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/savings.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AppState.init("savings", "Target Tabungan", "Rencanakan dan pantau pencapaian tabungan impian Anda");
      if (typeof renderSavings === "function") {
        renderSavings();
      }
    });
  </script>
</body>
</html>
