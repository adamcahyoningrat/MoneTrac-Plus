<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hutang & Piutang - MoneTrac+</title>
  
  <!-- Favicon MoneTrac+ -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="alternate icon" href="assets/img/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-theme="light">
  <div class="app-layout">
    <!-- Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <div class="main-content">
      <!-- Dynamic Navbar -->
      <div id="navbar-container"></div>

      <!-- Main Page Content -->
      <main class="content-wrapper">
        <!-- 4 Stat Cards Sejajar Rapi -->
        <div class="stats-grid">
          <!-- Card 1: Total Hutang -->
          <div class="stat-card" style="--stat-gradient: linear-gradient(135deg, #ef4444, #b91c1c); --stat-color: #ef4444; --stat-bg: rgba(239, 68, 68, 0.12);">
            <div class="stat-card-header">
              <span class="stat-label">Total Hutang Saya</span>
              <div class="stat-icon"><i class="fa-solid fa-arrow-down-long"></i></div>
            </div>
            <div class="stat-value" id="debts-total-payable" style="color:#ef4444;">Rp 0</div>
            <div class="stat-footer">
              <span class="stat-trend down"><i class="fa-solid fa-clock"></i> Kewajiban belum lunas</span>
            </div>
          </div>

          <!-- Card 2: Total Piutang -->
          <div class="stat-card" style="--stat-gradient: linear-gradient(135deg, #10b981, #059669); --stat-color: #10b981; --stat-bg: rgba(16, 185, 129, 0.12);">
            <div class="stat-card-header">
              <span class="stat-label">Total Piutang Saya</span>
              <div class="stat-icon"><i class="fa-solid fa-arrow-up-long"></i></div>
            </div>
            <div class="stat-value" id="debts-total-receivable" style="color:#10b981;">Rp 0</div>
            <div class="stat-footer">
              <span class="stat-trend up"><i class="fa-solid fa-hand-holding-dollar"></i> Tagihan di orang lain</span>
            </div>
          </div>

          <!-- Card 3: Selisih Bersih (Net Balance) -->
          <div class="stat-card" style="--stat-gradient: var(--primary-gradient); --stat-color: var(--primary); --stat-bg: rgba(59, 130, 246, 0.12);">
            <div class="stat-card-header">
              <span class="stat-label">Selisih Bersih (Net)</span>
              <div class="stat-icon"><i class="fa-solid fa-scale-balanced"></i></div>
            </div>
            <div class="stat-value" id="debts-net-balance">Rp 0</div>
            <div class="stat-footer">
              <span style="font-size:0.8rem;color:var(--text-muted);"><i class="fa-solid fa-calculator"></i> Piutang - Hutang</span>
            </div>
          </div>

          <!-- Card 4: Status Selesai / Lunas -->
          <div class="stat-card" style="--stat-gradient: linear-gradient(135deg, #8b5cf6, #6d28d9); --stat-color: #8b5cf6; --stat-bg: rgba(139, 92, 246, 0.12);">
            <div class="stat-card-header">
              <span class="stat-label">Status Pelunasan</span>
              <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
            </div>
            <div class="stat-value" id="debts-total-paid" style="color:#8b5cf6;">0 Lunas</div>
            <div class="stat-footer">
              <span style="font-size:0.8rem;color:var(--text-muted);"><i class="fa-solid fa-list-check"></i> Dari seluruh catatan</span>
            </div>
          </div>
        </div>

        <!-- Section Title & Action Button -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
          <div>
            <h2 style="font-size:1.25rem;font-weight:700;color:var(--text-primary);margin:0;">Daftar Hutang & Piutang</h2>
            <p style="font-size:0.85rem;color:var(--text-muted);margin-top:2px;">Pantau progres pembayaran pinjaman dan tagihan Anda</p>
          </div>

          <button class="btn btn-primary" onclick="Modal.openDebtModal()">
            <i class="fa-solid fa-plus"></i> Tambah Catatan Baru
          </button>
        </div>

        <!-- Filter Tabs -->
        <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm debt-filter-btn active" data-filter="all" onclick="filterDebts('all')">
            <i class="fa-solid fa-layer-group"></i> Semua
          </button>
          <button class="btn btn-secondary btn-sm debt-filter-btn" data-filter="payable" onclick="filterDebts('payable')">
            <i class="fa-solid fa-arrow-down-long" style="color:#ef4444;"></i> Hutang Saya (Payable)
          </button>
          <button class="btn btn-secondary btn-sm debt-filter-btn" data-filter="receivable" onclick="filterDebts('receivable')">
            <i class="fa-solid fa-arrow-up-long" style="color:#10b981;"></i> Piutang Saya (Receivable)
          </button>
        </div>

        <!-- Cards Grid Container -->
        <div class="goals-grid" id="debts-grid">
          <!-- Dynamic Injected Cards -->
        </div>
      </main>
    </div>
  </div>

  <div id="universal-modal" class="modal-overlay"></div>

  <!-- Universal Scripts -->
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/components/navbar.js"></script>
  <script src="assets/components/sidebar.js"></script>
  <script src="assets/components/modal.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/debts.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AppState.init("debts", "Hutang & Piutang", "Pantau dan kelola kewajiban serta pinjaman Anda");
      if (typeof renderDebts === "function") {
        renderDebts();
      }
    });
  </script>
</body>
</html>
