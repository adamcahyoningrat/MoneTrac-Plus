<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hutang & Piutang - MoneTrac+</title>
  
  <!-- Favicon MoneTrac+ -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="alternate icon" href="assets/img/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="theme-light">
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-content-wrapper">
      <div id="navbar-container"></div>

      <main class="page-body">
        <div class="page-container">
          <!-- Action Bar -->
          <div class="section-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
            <div>
              <h2 style="font-size:1.4rem;font-weight:800;color:var(--text-primary);margin:0;">Catatan Hutang & Piutang</h2>
              <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:2px;">Pantau kewajiban dan tagihan Anda secara teratur</div>
            </div>
            <button class="btn btn-primary" onclick="Modal.openDebtModal()">
              <i class="fa-solid fa-plus"></i> Tambah Catatan
            </button>
          </div>

          <!-- Stat Cards -->
          <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 24px;">
            <div class="stat-card">
              <div class="stat-icon" style="background:#ef444422;color:#ef4444;"><i class="fa-solid fa-arrow-down-long"></i></div>
              <div class="stat-info">
                <div class="stat-label">Total Hutang Saya</div>
                <div class="stat-value" id="debts-total-payable" style="color:#ef4444;">Rp 0</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="background:#10b98122;color:#10b981;"><i class="fa-solid fa-arrow-up-long"></i></div>
              <div class="stat-info">
                <div class="stat-label">Total Piutang Saya</div>
                <div class="stat-value" id="debts-total-receivable" style="color:#10b981;">Rp 0</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="background:#2563eb22;color:#2563eb;"><i class="fa-solid fa-circle-check"></i></div>
              <div class="stat-info">
                <div class="stat-label">Total Selesai / Lunas</div>
                <div class="stat-value" id="debts-total-paid">0 Catatan</div>
              </div>
            </div>
          </div>

          <!-- Filter Tabs -->
          <div class="tabs-container" style="display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;">
            <button class="btn btn-sm debt-filter-btn active" data-filter="all" onclick="filterDebts('all')">Semua</button>
            <button class="btn btn-sm btn-secondary debt-filter-btn" data-filter="payable" onclick="filterDebts('payable')">Hutang Saya (Payable)</button>
            <button class="btn btn-sm btn-secondary debt-filter-btn" data-filter="receivable" onclick="filterDebts('receivable')">Piutang Saya (Receivable)</button>
          </div>

          <!-- Cards Grid Container -->
          <div class="goals-grid" id="debts-grid">
            <!-- Dynamic injected cards -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="universal-modal" class="modal-overlay"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/components/navbar.js"></script>
  <script src="assets/components/sidebar.js"></script>
  <script src="assets/components/modal.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/debts.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AppState.init("debts", "Hutang & Piutang", "Pantau dan kelola kewajiban serta pinjaman Anda");
      if (typeof renderDebts === "function") {
        renderDebts();
      }
    });
  </script>
</body>
</html>
