<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk & Daftar - MoneTrac</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.1), transparent 40%),
                  var(--bg-body);
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 460px;
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body data-theme="dark">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <div class="brand-icon">
            <i class="fa-solid fa-coins"></i>
          </div>
          <div class="brand-text" style="font-size:1.6rem;">Mone<span>Trac</span></div>
        </div>
        <p style="color:var(--text-muted);font-size:0.9rem;" id="auth-subtitle">Kelola keuangan pribadi & target tabungan dengan mudah</p>
      </div>

      <!-- Auth Mode Switcher -->
      <div class="type-tabs" style="margin-bottom:24px;">
        <button type="button" class="type-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk
        </button>
        <button type="button" class="type-tab-btn" id="tab-register" onclick="switchAuthTab('register')">
          <i class="fa-solid fa-user-plus"></i> Daftar
        </button>
      </div>

      <!-- Form Login / Register -->
      <form id="auth-form">
        <div class="form-group" id="group-fullname" style="display:none;">
          <label class="form-label" for="auth-fullname">Nama Lengkap</label>
          <input type="text" id="auth-fullname" class="form-control" placeholder="Contoh: Adam Cahyo">
        </div>

        <div class="form-group">
          <label class="form-label" for="auth-email">Email</label>
          <input type="email" id="auth-email" class="form-control" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="auth-password">Password</label>
          <div style="position:relative;">
            <input type="password" id="auth-password" class="form-control" placeholder="••••••••" required minlength="6" style="padding-right:42px;">
            <button type="button" onclick="togglePasswordVisibility()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">
              <i class="fa-solid fa-eye" id="pwd-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-auth-submit" style="margin-top:12px;">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk ke Akun
        </button>

        <button type="button" class="btn btn-secondary btn-block" onclick="enterDemoMode()" style="margin-top:10px;">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Masuk Mode Demo / Offline
        </button>
      </form>

      <!-- Supabase Quick Configuration Toggle -->
      <div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--border-color);text-align:center;">
        <a href="javascript:void(0)" onclick="toggleConfigBox()" style="font-size:0.82rem;color:var(--text-muted);">
          <i class="fa-solid fa-gear"></i> Konfigurasi Supabase URL & Key
        </a>
      </div>

      <div id="quick-config-box" style="display:none;margin-top:16px;background:var(--bg-hover);padding:16px;border-radius:var(--radius-md);border:1px solid var(--border-color);">
        <div style="font-size:0.85rem;font-weight:700;margin-bottom:8px;color:var(--text-primary);">Pengaturan Supabase</div>
        <div class="form-group" style="margin-bottom:10px;">
          <label class="form-label" style="font-size:0.75rem;">Supabase URL</label>
          <input type="text" id="quick-url" class="form-control" placeholder="https://xyz.supabase.co" style="font-size:0.82rem;padding:8px 12px;">
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label" style="font-size:0.75rem;">Supabase Anon Key</label>
          <input type="password" id="quick-key" class="form-control" placeholder="eyJhbGciOi..." style="font-size:0.82rem;padding:8px 12px;">
        </div>
        <button type="button" class="btn btn-primary btn-sm btn-block" onclick="saveQuickConfig()">
          Simpan Konfigurasi
        </button>
      </div>
    </div>
  </div>

  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script>
    let currentMode = "login";

    document.addEventListener("DOMContentLoaded", async () => {
      await Auth.redirectIfAuthenticated();
      document.getElementById("quick-url").value = SupabaseConfig.getUrl();
      document.getElementById("quick-key").value = SupabaseConfig.getAnonKey();
    });

    function switchAuthTab(mode) {
      currentMode = mode;
      document.getElementById("tab-login").classList.toggle("active", mode === "login");
      document.getElementById("tab-register").classList.toggle("active", mode === "register");
      document.getElementById("group-fullname").style.display = mode === "register" ? "flex" : "none";
      document.getElementById("auth-subtitle").textContent = mode === "register" ? "Buat akun baru untuk mulai mencatat keuangan" : "Kelola keuangan pribadi & target tabungan dengan mudah";
      document.getElementById("btn-auth-submit").innerHTML = mode === "register" ? '<i class="fa-solid fa-user-plus"></i> Daftar Akun Baru' : '<i class="fa-solid fa-right-to-bracket"></i> Masuk ke Akun';
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById("auth-password");
      const icon = document.getElementById("pwd-icon");
      if (pwd.type === "password") {
        pwd.type = "text";
        icon.className = "fa-solid fa-eye-slash";
      } else {
        pwd.type = "password";
        icon.className = "fa-solid fa-eye";
      }
    }

    function toggleConfigBox() {
      const box = document.getElementById("quick-config-box");
      box.style.display = box.style.display === "none" ? "block" : "none";
    }

    function saveQuickConfig() {
      const url = document.getElementById("quick-url").value;
      const key = document.getElementById("quick-key").value;
      SupabaseConfig.saveCredentials(url, key);
      Utils.showToast("Kredensial Supabase berhasil disimpan!", "success");
      toggleConfigBox();
    }

    async function enterDemoMode() {
      const mockUser = {
        id: "demo_user_local",
        email: "demo@monetrac.app",
        user_metadata: { full_name: "Demo User" }
      };
      localStorage.setItem("monetrac_local_user", JSON.stringify(mockUser));
      Utils.showToast("Masuk sebagai mode demo offline", "info");
      setTimeout(() => window.location.href = "index.html", 500);
    }

    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value;
      const fullName = document.getElementById("auth-fullname")?.value.trim() || email.split("@")[0];

      const btn = document.getElementById("btn-auth-submit");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;

      let res;
      if (currentMode === "register") {
        res = await Auth.register(email, password, fullName);
      } else {
        res = await Auth.login(email, password);
      }

      btn.disabled = false;
      btn.innerHTML = currentMode === "register" ? '<i class="fa-solid fa-user-plus"></i> Daftar Akun Baru' : '<i class="fa-solid fa-right-to-bracket"></i> Masuk ke Akun';

      if (res.success) {
        Utils.showToast(currentMode === "register" ? "Pendaftaran berhasil!" : "Berhasil masuk!", "success");
        setTimeout(() => window.location.href = "index.html", 600);
      } else {
        Utils.showToast(res.error || "Gagal melakukan autentikasi", "error");
      }
    });
  </script>
</body>
</html>
