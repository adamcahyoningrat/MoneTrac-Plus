<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masuk & Daftar - MoneTrac+</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="alternate icon" href="assets/img/favicon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.15), transparent 45%), radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.1), transparent 45%), var(--bg-body);
      width: 100%;
      box-sizing: border-box;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
      box-shadow: var(--shadow-lg);
      box-sizing: border-box;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body data-theme="light">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="margin-bottom:14px;"><a href="index.html" style="font-size:0.82rem;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a></div>
      <div class="auth-header">
        <div class="auth-brand">
          <img src="assets/img/logo-icon.svg" alt="MoneTrac+ Logo" class="brand-logo-img" style="width:48px;height:48px;border-radius:14px;">
          <div class="brand-text" style="font-size:1.8rem;font-weight:900;">Mone<span class="brand-accent" style="background:linear-gradient(135deg, #22d3ee 0%, #06b6d4 50%, #0ea5e9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Trac</span><span class="brand-plus" style="background:linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:0.75em;vertical-align:super;margin-left:2px;font-weight:900;transform:translateY(-0.3em);display:inline-block;">+</span></div>
        </div>
        <p style="color:var(--text-muted);font-size:0.85rem;" id="auth-subtitle">Aplikasi Pengelola Keuangan Pribadi & Target Tabungan</p>
      </div>

      <!-- Auth Mode Switcher -->
      <div class="type-tabs" style="margin-bottom:20px;display:flex;background:#f1f5f9;border-radius:12px;padding:4px;gap:4px;border:1px solid #e2e8f0;">
        <button type="button" class="type-tab-btn active" id="tab-login" onclick="switchAuthTab('login')" style="flex:1;padding:9px 8px;border:none;outline:none;font-weight:700;font-size:0.85rem;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk
        </button>
        <button type="button" class="type-tab-btn" id="tab-register" onclick="switchAuthTab('register')" style="flex:1;padding:9px 8px;border:none;outline:none;font-weight:700;font-size:0.85rem;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:#64748b;">
          <i class="fa-solid fa-user-plus"></i> Daftar Akun
        </button>
      </div>

      <!-- Form Login / Register -->
      <form id="auth-form">
        <div class="form-group" id="group-fullname" style="display:none;">
          <label class="form-label" for="auth-fullname">Nama Lengkap</label>
          <input type="text" id="auth-fullname" class="form-control" placeholder="Nama Anda">
        </div>

        <div class="form-group">
          <label class="form-label" for="auth-email">Email</label>
          <input type="email" id="auth-email" class="form-control" placeholder="nama@email.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <label class="form-label" for="auth-password">Password</label>
            <a href="javascript:void(0)" onclick="handleForgotPassword()" id="link-forgot-pwd" style="font-size:0.78rem;color:var(--primary);">Lupa password?</a>
          </div>
          <div style="position:relative;margin-top:2px;">
            <input type="password" id="auth-password" class="form-control" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="current-password" style="padding-right:40px;">
            <button type="button" onclick="togglePasswordVisibility()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;">
              <i class="fa-solid fa-eye" id="pwd-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-auth-submit" style="margin-top:14px;">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk ke Akun
        </button>
      </form>

      <div style="margin-top:20px;text-align:center;">
        <span style="font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:6px;">
          <i class="fa-solid fa-shield-halved" style="color:var(--success);"></i> Data & Akun Terenkripsi Aman dengan RLS
        </span>
      </div>
    </div>
  </div>

  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script>
    let currentMode = "login";

    document.addEventListener("DOMContentLoaded", async () => {
      await Auth.redirectIfAuthenticated();
    });

    function switchAuthTab(mode) {
      currentMode = mode;
      document.getElementById("tab-login").classList.toggle("active", mode === "login");
      document.getElementById("tab-register").classList.toggle("active", mode === "register");
      document.getElementById("group-fullname").style.display = mode === "register" ? "flex" : "none";
      document.getElementById("link-forgot-pwd").style.display = mode === "register" ? "none" : "block";
      document.getElementById("auth-subtitle").textContent = mode === "register" ? "Buat akun baru untuk mulai mencatat keuangan pribadi" : "Aplikasi Pengelola Keuangan Pribadi & Target Tabungan";
      document.getElementById("btn-auth-submit").innerHTML = mode === "register" ? '<i class="fa-solid fa-user-plus"></i> Daftar Akun Baru' : '<i class="fa-solid fa-right-to-bracket"></i> Masuk ke Akun';
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById("auth-password");
      const icon = document.getElementById("pwd-icon");
      if (pwd.type === "password") {
        pwd.type = "text";
        icon.className = "fa-solid fa-eye-slash";
      } else {
        pwd.type = "password";
        icon.className = "fa-solid fa-eye";
      }
    }

    async function handleForgotPassword() {
      const email = prompt("Masukkan email akun Anda untuk menerima instruksi reset password:");
      if (email && email.trim()) {
        const res = await Auth.resetPassword(email.trim());
        if (res.success) {
          Utils.showToast(res.message, "success");
        } else {
          Utils.showToast("Gagal: " + res.error, "error");
        }
      }
    }

    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value;
      const fullName = document.getElementById("auth-fullname")?.value.trim() || email.split("@")[0];

      const btn = document.getElementById("btn-auth-submit");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;

      let res;
      if (currentMode === "register") {
        res = await Auth.register(email, password, fullName);
      } else {
        res = await Auth.login(email, password);
      }

      btn.disabled = false;
      btn.innerHTML = currentMode === "register" ? '<i class="fa-solid fa-user-plus"></i> Daftar Akun Baru' : '<i class="fa-solid fa-right-to-bracket"></i> Masuk ke Akun';

      if (res.success) {
        Utils.showToast(currentMode === "register" ? "Pendaftaran berhasil! Mengalihkan..." : "Berhasil masuk!", "success");
        setTimeout(() => window.location.href = "dashboard.html", 600);
      } else {
        Utils.showToast(res.error || "Gagal melakukan autentikasi", "error");
      }
    });
  </script>
</body>
</html>
