<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anggaran (Budget) - MoneTrac+</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-theme="light">
  <div class="app-layout">
    <!-- Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <div class="main-content">
      <!-- Dynamic Navbar -->
      <div id="navbar-container"></div>

      <!-- Main Page Content -->
      <main class="content-wrapper">
        
<!-- Budget Summary Cards -->
<div class="stats-grid">
  <div class="stat-card" style="--stat-gradient: var(--primary-gradient); --stat-color: var(--primary); --stat-bg: rgba(59, 130, 246, 0.12);">
    <div class="stat-card-header">
      <span class="stat-label">Total Batas Anggaran</span>
      <div class="stat-icon"><i class="fa-solid fa-chart-simple"></i></div>
    </div>
    <div class="stat-value" id="budget-total-limit">Rp 0</div>
    <div class="stat-footer">
      <span style="font-size:0.8rem;color:var(--text-muted);">Alokasi bulanan</span>
    </div>
  </div>

  <div class="stat-card" style="--stat-gradient: var(--danger-gradient); --stat-color: var(--danger); --stat-bg: rgba(239, 68, 68, 0.12);">
    <div class="stat-card-header">
      <span class="stat-label">Total Terpakai Bulan Ini</span>
      <div class="stat-icon"><i class="fa-solid fa-receipt"></i></div>
    </div>
    <div class="stat-value" id="budget-total-spent" style="color:var(--danger);">Rp 0</div>
    <div class="stat-footer">
      <span class="stat-trend down"><i class="fa-solid fa-arrow-down"></i> Pengeluaran riil</span>
    </div>
  </div>

  <div class="stat-card" style="--stat-gradient: var(--success-gradient); --stat-color: var(--success); --stat-bg: rgba(16, 185, 129, 0.12);">
    <div class="stat-card-header">
      <span class="stat-label">Sisa Anggaran Aman</span>
      <div class="stat-icon"><i class="fa-solid fa-shield-halved"></i></div>
    </div>
    <div class="stat-value" id="budget-total-remaining" style="color:var(--success);">Rp 0</div>
    <div class="stat-footer">
      <span class="stat-trend up"><i class="fa-solid fa-check"></i> Belum terpakai</span>
    </div>
  </div>

  <div class="stat-card" style="--stat-gradient: var(--accent-gradient); --stat-color: #8b5cf6; --stat-bg: rgba(139, 92, 246, 0.12);">
    <div class="stat-card-header">
      <span class="stat-label">Persentase Konsumsi</span>
      <div class="stat-icon"><i class="fa-solid fa-percent"></i></div>
    </div>
    <div class="stat-value" id="budget-overall-percent" style="color:#8b5cf6;">0%</div>
    <div class="stat-footer">
      <span style="font-size:0.8rem;color:var(--text-muted);">Dari total limit bulanan</span>
    </div>
  </div>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
  <div>
    <h2 style="font-size:1.25rem;font-weight:700;color:var(--text-primary);">Rincian Anggaran Kategori</h2>
    <p style="font-size:0.85rem;color:var(--text-muted);">Pantau batas belanja setiap pos agar tidak overbudget</p>
  </div>

  <button class="btn btn-primary" onclick="openBudgetModal()">
    <i class="fa-solid fa-plus"></i> Atur Anggaran Baru
  </button>
</div>

<!-- Budget Cards List -->
<div id="budget-list" style="display:flex;flex-direction:column;gap:16px;">
  <!-- Budget Cards Injected Here -->
</div>

      </main>
    </div>
  </div>

  <!-- Universal Scripts -->
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/components/navbar.js"></script>
  <script src="assets/components/sidebar.js"></script>
  <script src="assets/components/modal.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/budget.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AppState.init("budget", "Anggaran (Budget)", "Tetapkan dan kontrol batas pengeluaran bulanan Anda");
      if (typeof budgetInit === "function") {
        budgetInit();
      } else if (typeof renderAnggaran(Budget) === "function") {
        renderAnggaran(Budget)();
      } else if (typeof renderDashboard === "function") {
        renderDashboard();
      }
    });
  </script>
</body>
</html>
