<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="aqua-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aqua Squircle Tile -->
  <rect x="32" y="32" width="448" height="448" rx="105" fill="url(#aqua-bg)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <g filter="url(#soft-shadow)">
    <!-- 3 Vertical Pillars (Variation 4 Stepped M) -->
    <!-- Left Pillar (Y: 135 to 375, X: 95 to 135, width=40) -->
    <rect x="95" y="135" width="40" height="240" rx="10" fill="#ffffff" />
    
    <!-- Center Pillar (Y: 175 to 375, X: 200 to 240, width=40) -->
    <rect x="200" y="175" width="40" height="200" rx="10" fill="#ffffff" />

    <!-- Right Pillar (Y: 135 to 375, X: 305 to 345, width=40) -->
    <rect x="305" y="135" width="40" height="240" rx="10" fill="#ffffff" />

    <!-- Horizontal Connecting Crossbar (Y: 175 to 215, X: 95 to 345, width=250, height=40) -->
    <rect x="95" y="175" width="250" height="40" rx="8" fill="#ffffff" />

    <!-- Standalone Pure White PLUS (+) Sign (Top Right) -->
    <!-- Vertical Plus Bar -->
    <rect x="385" y="100" width="18" height="70" rx="9" fill="#ffffff" />
    <!-- Horizontal Plus Bar -->
    <rect x="359" y="126" width="70" height="18" rx="9" fill="#ffffff" />
  </g>
</svg>