<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Main Shield / Squircle Gradient -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Growth Ascending Gradient -->
    <linearGradient id="growth-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Plus Badge Gradient -->
    <linearGradient id="plus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="plus-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ec4899" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Outer Glowing Ring -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="none" stroke="url(#icon-grad)" stroke-width="3" opacity="0.4" />

  <!-- Central 'M' Growth Tracking Dynamic Wave -->
  <!-- Left Pillar -->
  <path d="M 128 352 L 128 240 C 128 222, 142 208, 160 208 C 178 208, 192 222, 192 240 L 192 352 C 192 364, 180 376, 160 376 C 140 376, 128 364, 128 352 Z" fill="url(#icon-grad)" />

  <!-- Center Peak & Coin Circle -->
  <path d="M 192 240 C 192 190, 220 156, 256 156 C 292 156, 320 190, 320 240 L 320 352 C 320 364, 308 376, 288 376 C 268 376, 256 364, 256 352 L 256 240 C 256 222, 246 208, 236 208 C 226 208, 216 222, 216 240 L 216 352 C 216 364, 204 376, 192 376 Z" fill="url(#icon-grad)" opacity="0.9" />

  <!-- Right Growth Bar (Ascending Emerald to Sky) -->
  <path d="M 320 190 L 320 352 C 320 368, 332 376, 352 376 C 372 376, 384 368, 384 352 L 384 150 C 384 132, 370 118, 352 118 C 334 118, 320 132, 320 150 Z" fill="url(#growth-grad)" />

  <!-- Intersecting Golden Coin Ring (FinTech Identity) -->
  <circle cx="256" cy="270" r="44" fill="none" stroke="#38bdf8" stroke-width="12" opacity="0.85" filter="url(#glow)" />
  <circle cx="256" cy="270" r="18" fill="#10b981" />

  <!-- Trending Arrow Tip on Right Growth Bar -->
  <path d="M 328 120 L 376 120 L 376 168" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Modern PLUS (+) Badge at Top Right -->
  <g filter="url(#plus-glow)">
    <circle cx="390" cy="110" r="54" fill="url(#plus-grad)" />
    <!-- Plus Sign -->
    <path d="M 390 86 L 390 134 M 366 110 L 414 110" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>