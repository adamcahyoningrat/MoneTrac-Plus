<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="plus-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="icon-grad-sm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ec4899" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="90" height="90" rx="24" fill="#161f30" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <!-- M Bars -->
    <path d="M 22 68 L 22 45 C 22 40, 26 36, 31 36 C 36 36, 40 40, 40 45 L 40 68" fill="none" stroke="url(#brand-grad)" stroke-width="7" stroke-linecap="round" />
    <path d="M 40 48 C 40 38, 46 30, 54 30 C 62 30, 68 38, 68 48 L 68 68" fill="none" stroke="url(#icon-grad-sm)" stroke-width="7" stroke-linecap="round" />
    <!-- Mini Coin -->
    <circle cx="45" cy="52" r="7" fill="#38bdf8" />
    <!-- Mini Plus Dot -->
    <g filter="url(#badge-glow)">
      <circle cx="75" cy="15" r="16" fill="url(#plus-badge-grad)" />
      <path d="M 75 9 L 75 21 M 69 15 L 81 15" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Typography -->
  <text x="125" y="74" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="44" fill="#f8fafc" letter-spacing="-1.2">Mone<tspan fill="url(#brand-grad)">Trac</tspan></text>

  <!-- PLUS SUPERSCRIPT BADGE -->
  <g transform="translate(378, 32)" filter="url(#badge-glow)">
    <rect x="0" y="0" width="46" height="30" rx="8" fill="url(#plus-badge-grad)" />
    <text x="23" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">+</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="128" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="1.8" text-transform="uppercase">Smart Finance Tracker</text>
</svg>