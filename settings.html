<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="alternate icon" href="assets/img/favicon.png">
  <title>Pengaturan - MoneTrac+</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-theme="light">
  <div class="app-layout">
    <!-- Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <div class="main-content">
      <!-- Dynamic Navbar -->
      <div id="navbar-container"></div>

      <!-- Main Page Content -->
      <main class="content-wrapper">
        
<div class="two-col-grid">
  <!-- User Profile Card -->
  <div class="card">
    <div class="card-header">
      <div class="card-title"><i class="fa-solid fa-user" style="color:var(--primary);"></i> Profil Pengguna</div>
    </div>
    <form id="profile-form" onsubmit="saveUserProfile(event)">
      <div class="form-group">
        <label class="form-label" for="settings-user-name">Nama Lengkap / Tampilan</label>
        <input type="text" id="settings-user-name" class="form-control" placeholder="Nama Anda" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="settings-user-email">Email Terdaftar</label>
        <input type="email" id="settings-user-email" class="form-control" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="settings-new-password">Ganti Password Baru (Opsional)</label>
        <input type="password" id="settings-new-password" class="form-control" placeholder="Kosongkan jika tidak ingin ganti password" minlength="6">
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
        <button type="submit" class="btn btn-primary btn-sm" id="btn-save-profile">
          <i class="fa-solid fa-floppy-disk"></i> Simpan Profil
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="Auth.logout()">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar dari Akun
        </button>
      </div>
    </form>
  </div>

  <!-- App Preferences Card -->
  <div class="card">
    <div class="card-header">
      <div class="card-title"><i class="fa-solid fa-sliders" style="color:#8b5cf6;"></i> Preferensi Aplikasi</div>
    </div>
    <div class="form-group">
      <label class="form-label">Tema Tampilan</label>
      <div style="display:flex;gap:16px;margin-top:4px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="radio" name="theme-choice" id="theme-dark" value="dark" onchange="AppState.setTheme('dark')">
          <span>Mode Gelap (Dark)</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="radio" name="theme-choice" id="theme-light" value="light" onchange="AppState.setTheme('light')">
          <span>Mode Terang (Light)</span>
        </label>
      </div>
    </div>

    <div class="form-group" style="margin-top:14px;">
      <label class="form-label">Mode Privasi Saldo</label>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:4px;">
        <input type="checkbox" id="settings-privacy-default" onchange="AppState.setPrivacyMode(this.checked)">
        <span>Samarkan semua nominal angka saldo saat membuka aplikasi</span>
      </label>
    </div>

    <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:0.82rem;color:var(--text-muted);">Status Database:</span>
      <span id="supabase-status-badge" class="badge badge-income"><i class="fa-solid fa-circle-check"></i> Supabase Terhubung</span>
    </div>
  </div>

  <!-- Data Migration & Backup -->
  <div class="card" style="grid-column: 1 / -1;">
    <div class="card-header">
      <div class="card-title"><i class="fa-solid fa-file-import" style="color:var(--warning);"></i> Migrasi & Backup Data</div>
    </div>
    <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:12px;">
      Punya data JSON dari database Google Sheet MoneTrac lama? Tempelkan teks JSON di bawah ini untuk mengimpor seluruh riwayat akun dan transaksi ke akun Anda saat ini.
    </p>
    <div class="form-group">
      <textarea id="import-json-input" class="form-control" rows="3" placeholder='{"myfinance_transactions": [...], "myfinance_accounts": [...]}'></textarea>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-warning btn-sm" onclick="importGSheetJSON()" style="color:#000;">
        <i class="fa-solid fa-file-import"></i> Mulai Migrasi ke Akun Ini
      </button>
      <button class="btn btn-secondary btn-sm" onclick="exportFullBackupJSON()">
        <i class="fa-solid fa-download"></i> Download Backup JSON
      </button>
    </div>
  </div>
</div>

      </main>
    </div>
  </div>

    <!-- Universal Scripts -->
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/components/navbar.js"></script>
  <script src="assets/components/sidebar.js"></script>
  <script src="assets/components/modal.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/settings.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AppState.init("settings", "Pengaturan", "Profil pengguna, preferensi aplikasi, dan migrasi data");
      if (typeof renderSettings === "function") {
        renderSettings();
      }
    });
  </script>
</body>
</html>
